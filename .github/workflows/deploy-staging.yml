name: Build check (Staging)

# Cloudflare Pages deploys this branch itself (git integration, project
# "visionchain-staging"). This workflow only checks that the staging build
# still succeeds. It used to deploy too, through cloudflare/pages-action,
# which no longer exists.

on:
  push:
    branches: [staging]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Staging
        run: npm run build:staging
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: visionchain-staging.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: visionchain-staging
          VITE_FIREBASE_STORAGE_BUCKET: visionchain-staging.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.STAGING_FIREBASE_MEASUREMENT_ID }}
          VITE_CHAIN_ENV: staging
          VITE_RPC_URL: https://api.visionchain.co/rpc-proxy
