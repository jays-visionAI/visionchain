name: Build check (Production)

# Cloudflare Pages deploys this branch itself (git integration, project
# "visionchain"). This workflow only checks that the production build
# still succeeds. It used to deploy too, through cloudflare/pages-action,
# which no longer exists.

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Production
        run: npm run build:production
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: visionchain-d19ed.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: visionchain-d19ed
          VITE_FIREBASE_STORAGE_BUCKET: visionchain-d19ed.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.PROD_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.PROD_FIREBASE_MEASUREMENT_ID }}
          VITE_CHAIN_ENV: production
          VITE_RPC_URL: https://api.visionchain.co/rpc-proxy
